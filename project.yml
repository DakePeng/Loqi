# XcodeGen manifest — run `xcodegen generate` to produce Locally.xcodeproj
# Install: brew install xcodegen
name: Locally
options:
  bundleIdPrefix: com.kunzhipeng
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.3
  # Downloader + tokenizer integrations the MLXHuggingFace macros expand to
  # (versions per mlx-swift-lm README).
  HuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
  # Speaker embeddings (voiceprint) on CoreML/ANE. Pinned exactly: loose
  # ranges resolved differently on different machines (0.9.1 vs 0.15.2).
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    # Set your personal/dev team in Xcode (Signing & Capabilities) or here:
    # DEVELOPMENT_TEAM: XXXXXXXXXX

targets:
  Locally:
    type: application
    platform: iOS
    sources:
      - Locally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kunzhipeng.locally
        CODE_SIGN_ENTITLEMENTS: Locally/Locally.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # sherpa-onnx (SenseVoice ASR): C API via bridging header, static
        # xcframeworks under ThirdParty/ (fetched by Scripts/fetch-sherpa-onnx.sh).
        SWIFT_OBJC_BRIDGING_HEADER: Locally/Pipeline/ASR/SherpaOnnx/SherpaOnnx-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/ThirdParty/sherpa-onnx/sherpa-onnx.xcframework/Headers
        OTHER_LDFLAGS:
          - -lc++
    # Explicit Info.plist (generated by xcodegen): document types can't be
    # expressed as INFOPLIST_KEY_ build settings, and they're what makes
    # Locally appear in Voice Memos' share sheet.
    info:
      path: Locally/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Locally listens through the microphone to transcribe and translate speech. Audio never leaves your device."
        NSSpeechRecognitionUsageDescription: "Locally transcribes speech entirely on-device to show live translated captions."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
    dependencies:
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXLMCommon
      - package: MLXLM
        product: MLXHuggingFace
      - package: HuggingFace
        product: HuggingFace
      - package: Transformers
        product: Tokenizers
      - package: FluidAudio
        product: FluidAudio
      - framework: ThirdParty/sherpa-onnx/sherpa-onnx.xcframework
        embed: false
      - framework: ThirdParty/sherpa-onnx/onnxruntime.xcframework
        embed: false

  LocallyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LocallyTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        # @testable import of a module built with a bridging header needs
        # the same header search path.
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/ThirdParty/sherpa-onnx/sherpa-onnx.xcframework/Headers
    dependencies:
      - target: Locally

schemes:
  Locally:
    build:
      targets:
        Locally: all
    test:
      targets:
        - LocallyTests
