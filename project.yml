# XcodeGen manifest — run `xcodegen generate` to produce Loqi.xcodeproj
# Install: brew install xcodegen
name: Loqi
options:
  bundleIdPrefix: com.kunzhipeng
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.3
  # Downloader + tokenizer integrations the MLXHuggingFace macros expand to
  # (versions per mlx-swift-lm README).
  HuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
  # Speaker embeddings (voiceprint) on CoreML/ANE. Pinned exactly: loose
  # ranges resolved differently on different machines (0.9.1 vs 0.15.2).
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    # Set your personal/dev team in Xcode (Signing & Capabilities) or here:
    # DEVELOPMENT_TEAM: XXXXXXXXXX

targets:
  Loqi:
    type: application
    platform: iOS
    sources:
      - Loqi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kunzhipeng.loqi
        CODE_SIGN_ENTITLEMENTS: Loqi/Loqi.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # sherpa-onnx (SenseVoice ASR): C API via bridging header, static
        # xcframeworks under ThirdParty/ (fetched by Scripts/fetch-sherpa-onnx.sh).
        SWIFT_OBJC_BRIDGING_HEADER: Loqi/Pipeline/ASR/SherpaOnnx/SherpaOnnx-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/ThirdParty/sherpa-onnx/sherpa-onnx.xcframework/Headers
        OTHER_LDFLAGS:
          - -lc++
    # Explicit Info.plist (generated by xcodegen): document types can't be
    # expressed as INFOPLIST_KEY_ build settings, and they're what makes
    # Loqi appear in Voice Memos' share sheet.
    info:
      path: Loqi/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Loqi listens through the microphone to transcribe and translate speech. Audio never leaves your device."
        NSSpeechRecognitionUsageDescription: "Loqi transcribes speech entirely on-device to show live translated captions."
        NSCameraUsageDescription: "Loqi uses the camera to attach photos of slides and whiteboards to a session. Images never leave your device."
        # A running session keeps capturing when the screen locks or the
        # app backgrounds; LLM work pauses there (CaptionPipeline).
        UIBackgroundModes:
          - audio
        # Recording Live Activity (lock screen + Dynamic Island), rendered
        # by the LoqiWidgets extension.
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio or Video
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.movie
    dependencies:
      - package: MLXLM
        product: MLXLLM
      # Vision-LLM tier (Qwen3-VL): linking MLXVLM is all the load path
      # needs — loadModelContainer discovers its factory via the
      # NSClassFromString trampoline in MLXLMCommon.
      - package: MLXLM
        product: MLXVLM
      - package: MLXLM
        product: MLXLMCommon
      - package: MLXLM
        product: MLXHuggingFace
      - package: HuggingFace
        product: HuggingFace
      - package: Transformers
        product: Tokenizers
      - package: FluidAudio
        product: FluidAudio
      - framework: ThirdParty/sherpa-onnx/sherpa-onnx.xcframework
        embed: false
      - framework: ThirdParty/sherpa-onnx/onnxruntime.xcframework
        embed: false
      - target: LoqiWidgets
        embed: true

  # Live Activity UI + Control Center toggle. Deliberately lean: no
  # packages, no bridging header, none of the heavyweight ML deps — only
  # widget code plus the shared attribute/state types and the intent TYPES
  # (their perform() bodies are fenced to the app via LOQI_WIDGET; the
  # system executes them in the app process).
  LoqiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - LoqiWidgets
      - Loqi/Shared
      - path: Loqi/Intents/RecordingIntents.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kunzhipeng.loqi.LoqiWidgets
        CODE_SIGN_ENTITLEMENTS: LoqiWidgets/LoqiWidgets.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ["$(inherited)", "LOQI_WIDGET"]
        SKIP_INSTALL: true
    info:
      path: LoqiWidgets/Info.plist
      properties:
        CFBundleDisplayName: Loqi
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  LoqiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LoqiTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        # @testable import of a module built with a bridging header needs
        # the same header search path.
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/ThirdParty/sherpa-onnx/sherpa-onnx.xcframework/Headers
    dependencies:
      - target: Loqi

  # Onboarding smoke test. Its own scheme: XCUITest launches the full app,
  # so bundling it into the Loqi scheme would slow every `xcodebuild test`.
  LoqiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LoqiUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Loqi
    dependencies:
      - target: Loqi

schemes:
  Loqi:
    build:
      targets:
        Loqi: all
    test:
      targets:
        - LoqiTests
  LoqiUITests:
    build:
      targets:
        LoqiUITests: all
    test:
      targets:
        - LoqiUITests
